stages:
  ingest:
    cmd: python -m src.data.ingest
    deps:
      - src/data/ingest.py
    params:
      - data.raw_dir
    outs:
      - data/raw/dfire:
          persist: true   # keep existing files so a re-run does not re-download
      - data/raw/simuletic:
          persist: true
  validate:
    cmd: python -m src.data.validate_stage
    deps:
      - data/raw/dfire
      - src/data/validate.py
      - src/data/validate_stage.py
      - configs/classes.yaml
    params:
      - data.max_bad_bbox_fraction
    outs:
      - reports/validation_report.json
  validate_simuletic:
    cmd: python -m src.data.validate_simuletic
    deps:
      - data/raw/simuletic
      - src/data/validate_simuletic.py
      - src/data/simuletic.py
      - configs/classes.yaml
    outs:
      - reports/validation_simuletic.json
  prepare:
    cmd: python src/data/prepare.py
    deps:
      - data/raw/dfire
      - reports/validation_report.json
      - src/data/prepare.py
      - configs/classes.yaml
    params:
      - data.raw_dir
      - data.processed_dir
    outs:
      - data/processed/dfire
      - reports/prepare_stats.json
  prepare_simuletic:
    cmd: python -m src.data.prepare_simuletic
    deps:
      - data/raw/simuletic
      - data/processed/dfire
      - reports/validation_simuletic.json
      - src/data/prepare_simuletic.py
      - src/data/simuletic.py
      - configs/classes.yaml
    params:
      - data.processed_dir
      - data.seed
    outs:
      - data/processed/simuletic
      - data/processed/data.yaml
      - reports/simuletic_stats.json
  train_baseline:
    cmd: python -m src.baseline.train
    deps:
      - data/processed/dfire
      - src/baseline/common.py
      - src/baseline/train.py
    params:
      - baseline
    outs:
      - models/baseline
      - reports/baseline_train_baseline.json
  evaluate_baseline:
    cmd: python -m src.baseline.evaluate
    deps:
      - data/processed/dfire
      - data/processed/simuletic
      - models/baseline
      - src/baseline/common.py
      - src/baseline/evaluate.py
    params:
      - baseline
    metrics:
      - reports/baseline_metrics.json:
          cache: false
    outs:
      - reports/baseline_cm_dfire_test_baseline.png
      - reports/baseline_cm_simuletic_test_baseline.png
  train_detector:
    cmd: python -m src.detector.train
    deps:
      - data/processed/dfire
      - data/processed/simuletic
      - data/processed/data.yaml
      - src/detector/train.py
      - src/tracking/mlflow_utils.py
      - src/baseline/common.py
    params:
      - detector.model
      - detector.data
      - detector.imgsz
      - detector.epochs
      - detector.batch
      - detector.lr0
      - detector.optimizer
      - detector.patience
      - detector.fraction
      - detector.seed
      - detector.run_name
      - detector.out_dir
    outs:
      - models/detector
    plots:
      - reports/detector_train_detector.json:
          cache: false
          x: epoch
          y: val_map50_95
  evaluate_detector:
    cmd: python -m src.detector.evaluate
    deps:
      - data/processed/dfire
      - data/processed/simuletic
      - data/processed/data.yaml
      - models/detector
      - src/detector/evaluate.py
      - src/tracking/mlflow_utils.py
      - src/baseline/common.py
      - src/baseline/evaluate.py
    params:
      - detector.imgsz
      - detector.batch
      - detector.conf
      - detector.out_dir
      - detector.eval_sets
    metrics:
      - reports/detector_metrics.json:
          cache: false
    outs:
      - reports/detector_eval_detector
  compare:
    cmd: python -m src.compare
    deps:
      - reports/baseline_metrics.json
      - reports/detector_metrics.json
      - src/compare.py
    outs:
      - reports/comparison.md:
          cache: false
      - reports/comparison.png:
          cache: false
