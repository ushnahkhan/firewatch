data:
  max_bad_bbox_fraction: 0.005
  processed_dir: data/processed/dfire
  raw_dir: data/raw/dfire
  seed: 42
  expected_counts:
    train: 14122
    val: 3099
    test: 4306
  simuletic_exclude: [fire_detected_var16_img3]
baseline:
  img_size: 224
  batch_size: 32
  epochs: 2
  lr: 0.001
  weight_decay: 0.0001
  seed: 42
  num_workers: 0
  freeze_backbone: false
  subset_fraction: 0.1
  run_name: baseline-v1
  out_dir: models/baseline
  augment:
    hflip: true
    color_jitter: 0.2
  eval_sets:
    - {name: dfire_test, root: data/processed/dfire, split: test}
    - {name: simuletic_test, root: data/processed/simuletic, split: test}
detector:
  model: yolov8n.pt        # pretrained YOLOv8 nano (COCO), fine-tuned for smoke + fire boxes
  data: data/processed/data.yaml
  imgsz: 640
  epochs: 15
  batch: 32
  lr0: 0.01
  optimizer: SGD
  patience: 50
  fraction: 1.0            # share of the train split to use (develop on e.g. 0.1)
  seed: 42
  workers: 2
  device: null             # null = GPU if available, else CPU
  conf: 0.25               # min box confidence for the image-level fire/smoke/normal label
  run_name: detector-v1
  out_dir: models/detector
  eval_sets:
    - {name: dfire_test, data: data/processed/data.yaml, root: data/processed/dfire, split: test}
    - {name: simuletic_test, data: data/processed/simuletic/data.yaml, root: data/processed/simuletic, split: test}
