data:
  max_bad_bbox_fraction: 0.005
  processed_dir: data/processed/dfire
  raw_dir: data/raw/dfire
  seed: 42
  expected_counts:
    train: 14122
    val: 3099
    test: 4306
  simuletic_exclude: [fire_detected_var16_img3]
baseline:
  img_size: 224
  batch_size: 32
  epochs: 2
  lr: 0.001
  weight_decay: 0.0001
  seed: 42
  num_workers: 0
  freeze_backbone: false
  subset_fraction: 0.1
  run_name: baseline-v1
  out_dir: models/baseline
  augment:
    hflip: true
    color_jitter: 0.2
  eval_sets:
    - {name: dfire_test, root: data/processed/dfire, split: test}
    - {name: simuletic_test, root: data/processed/simuletic, split: test}